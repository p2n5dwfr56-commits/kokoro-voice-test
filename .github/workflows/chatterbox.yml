name: chatterbox-test
on:
  workflow_dispatch:
  push:
    paths: ['chatterbox_test.py', '.github/workflows/chatterbox.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: nproc; free -g | head -2; df -h / | tail -1
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install chatterbox-tts
      - name: Turbo (350M)
        continue-on-error: true
        timeout-minutes: 15
        run: python chatterbox_test.py turbo
      - name: Original (500M)
        continue-on-error: true
        timeout-minutes: 15
        run: python chatterbox_test.py original
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chatterbox-samples, path: '*.wav', retention-days: 7, if-no-files-found: warn }
