name: round4-qwen-and-chatterbox-reference
on:
  workflow_dispatch:
  push:
    paths: ['round4_text.py', 'qwen_voicedesign.py', 'chatterbox_ref.py', '.github/workflows/round4.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: nproc; free -g | head -2; df -h / | tail -1
      - name: Licences
        run: |
          curl -fsSL https://huggingface.co/api/models/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign | python -c "import sys,json; d=json.load(sys.stdin); print('Qwen licence:', d.get('cardData',{}).get('license'))"
          curl -fsSL https://www.openslr.org/resources/83/about.html -o /dev/null -w "openslr83 about: %{http_code}\n" || true
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install soundfile
      - name: Qwen3-TTS VoiceDesign
        continue-on-error: true
        timeout-minutes: 35
        run: python -m pip install qwen-tts && python qwen_voicedesign.py
      - name: Chatterbox with licensed Midlands reference
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir ref && cd ref && curl -fsSLO https://www.openslr.org/resources/83/midlands_english_male.zip && unzip -q midlands_english_male.zip && cat LICENSE* 2>/dev/null | head -20; cd ..
          python -m pip install chatterbox-tts
          python chatterbox_ref.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: round4-samples, path: '*.wav', retention-days: 7, if-no-files-found: warn }
