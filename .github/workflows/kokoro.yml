name: kokoro-voice-samples
on: workflow_dispatch
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check Hugging Face is reachable
        run: |
          curl -fsSIL https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/kokoro-v1_0.pth -o /dev/null -w "model: %{http_code}\n"
          for v in bm_george bm_lewis bf_emma; do curl -fsSIL https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/voices/$v.pt -o /dev/null -w "$v: %{http_code}\n"; done
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install kokoro soundfile
      - run: python make_samples.py
      - uses: actions/upload-artifact@v4
        with: { name: kokoro-samples, path: '*.wav', retention-days: 7 }
