name: kokoro-voice-samples
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check Hugging Face is reachable
        run: |
          curl -fsSIL https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/kokoro-v1_0.pth -o /dev/null -w "model: %{http_code}\n"
          for v in bm_george bm_lewis bf_emma; do curl -fsSIL https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/voices/$v.pt -o /dev/null -w "$v: %{http_code}\n"; done
      - name: List Piper English voices (alternative-accent investigation)
        run: |
          curl -fsSL https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json -o voices.json
          python - <<'PY'
          import json
          v=json.load(open('voices.json'))
          for k in sorted(v):
              if k.startswith('en_GB'): print(k, v[k].get('quality') if 'quality' in v[k] else '', v[k]['language']['name_english'], v[k]['num_speakers'])
          PY
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install piper-tts && python make_piper.py
      - uses: actions/upload-artifact@v4
        with: { name: piper-samples, path: '*.wav', retention-days: 7 }
