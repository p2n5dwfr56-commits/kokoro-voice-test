name: chatterbox-newcastle
on:
  workflow_dispatch:
  push:
    paths: ['chatterbox_vctk.py', '.github/workflows/vctk-discover.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install chatterbox-tts soundfile "pyarrow==17.0.0" "pandas==2.2.3" huggingface_hub
      - run: python chatterbox_vctk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: newcastle-lively, path: '*.wav', retention-days: 7, if-no-files-found: warn }
